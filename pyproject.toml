[project]
name = "pi-meter"
version = "0.1.0"
description = "Local usage dashboard for Pi coding-agent sessions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.3",
    "tzlocal>=5.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",       # async API client used by tests (httpx.AsyncClient/ASGITransport)
    "httpx2>=2.16.0",      # Starlette 1.9 TestClient backend; avoids its deprecation warning
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "slow: long-running checks (long transcripts, bounded performance runs)",
    "e2e: browser-facing behaviour exercised through the API (no browser needed)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
